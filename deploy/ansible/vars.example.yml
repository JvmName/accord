# Copy to vars.yml.
web_host: rdk.jvmname.dev
api_host: rdk.api.jvmname.dev
acme_email: you@example.com
# Public SSH key of the deploy user (the key the deploy workflow's DEPLOY_SSH_KEY secret is the private half of).
deploy_ssh_public_key: "ssh-ed25519 AAAA... deploy"
# Your own key, so you can still log in as the deploy user.
admin_ssh_public_keys:
  - "ssh-ed25519 AAAA... you@laptop"
heartbeat_url: ""
