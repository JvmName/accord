name: Server Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd server && bun install --frozen-lockfile

      - name: Typecheck
        run: cd server && bun run typecheck

      - name: Run tests
        run: cd server && bun run test

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_release.outputs.exists }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./server/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "server-${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release server-${{ steps.version.outputs.version }} already exists — skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # Builds and pushes the image on every new version. The deploy steps run only
  # when the repository variable VPS_HOST is set, so a version bump while there
  # is no server still builds, and still makes the release.
  deploy:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/accord-server" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Set up ssh
        if: vars.VPS_HOST != ''
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ vars.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        if: vars.VPS_HOST != ''
        env:
          TARGET: ${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}
        run: |
          # The token goes over stdin, so it never shows up in a process list.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy "$TARGET" "
            set -e
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd /srv/accord
            sed -i '/^API_TAG=/d' .env
            echo 'API_TAG=$VERSION' >> .env
            docker compose pull api
            docker compose up -d
            docker logout ghcr.io
          "

      - name: Wait until the server is healthy
        if: vars.VPS_HOST != ''
        env:
          TARGET: ${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" '
            for i in $(seq 1 30); do
              [ "$(docker inspect --format "{{.State.Health.Status}}" accord-api)" = healthy ] && exit 0
              sleep 2
            done
            docker logs --tail 50 accord-api
            exit 1
          '

  release:
    needs: [prepare, deploy]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("server-"))] | first | .tagName // ""')
          if [ -n "$PREV" ]; then
            NOTES=$(git log "${PREV}..HEAD" --oneline -- server/)
          else
            NOTES=$(git log --oneline -- server/)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.prepare.outputs.version }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "server-${{ needs.prepare.outputs.version }}" \
            --title "Server ${{ needs.prepare.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            $PRERELEASE_FLAG
