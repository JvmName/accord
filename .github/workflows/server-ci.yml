name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: OpenAPI spec matches the schemas
        run: |
          bun run generate:openapi
          git diff --exit-code openapi.json

      # `bun run test`, never a bare `bun test`: the script passes --isolate.
      - name: Test
        run: bun run test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t accord-server server

      - name: Start it and check the web process and the worker
        run: |
          docker run -d --name accord -p 3000:3000 -v accord-data:/data accord-server
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' accord)" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' accord | grep -x healthy
          curl -fsS -X POST localhost:3000/users -H 'content-type: application/json' -d '{"name":"ci"}' | grep -q '"status":"ok"'
          docker logs accord 2>&1 | grep -q 'WORKER.*Web socket connected'

      - name: Show the logs if it failed
        if: failure()
        run: docker logs accord
