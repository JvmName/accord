name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'app/gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_release.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Extract versionName
        id: version
        run: |
          VERSION=$(grep '^VERSION_NAME=' app/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "client-${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release client-${{ steps.version.outputs.version }} already exists — skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/androidApp/AccordProdKey.jks

      - name: Make gradlew executable
        if: steps.check_release.outputs.exists == 'false'
        run: chmod +x app/gradlew

      - name: Build APK and wasm distribution
        if: steps.check_release.outputs.exists == 'false'
        working-directory: app
        env:
          SIGNING_STORE_FILE: AccordProdKey.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -Prelease :shared:wasmJsBrowserDistribution

      - name: Locate and rename APK
        if: steps.check_release.outputs.exists == 'false'
        id: apk
        run: |
          APK=$(find app/androidApp/build/outputs/apk/release -name "*.apk" | head -1)
          VERSIONED="app/androidApp/build/outputs/apk/release/accord-${{ steps.version.outputs.version }}.apk"
          mv "$APK" "$VERSIONED"
          echo "path=$VERSIONED" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1

      - name: Upload wasm artifact
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: app/shared/build/dist/wasmJs/productionExecutable/
          retention-days: 1

  release-android:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-apk

      - name: Compute release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("client-"))] | first | .tagName // ""')
          if [ -n "$PREV" ]; then
            NOTES=$(git log "${PREV}..HEAD" --oneline -- app/)
          else
            NOTES=$(git log --oneline -- app/)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.build.outputs.version }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "client-${{ needs.build.outputs.version }}" \
            --title "Client ${{ needs.build.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            $PRERELEASE_FLAG \
            release-apk/accord-${{ needs.build.outputs.version }}.apk

  # Runs only when the repository variable VPS_HOST is set, so a release while
  # there is no server still builds the client and attaches the release files.
  web-deploy:
    needs: build
    if: needs.build.outputs.exists == 'false' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download wasm distribution
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wasm-dist

      - name: Set up ssh
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ vars.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Copy into a new release directory, then point `current` at it, so the site never serves a half-copied release.
      - name: Deploy to the VPS
        env:
          TARGET: ${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}
          RELEASE: ${{ github.sha }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy"
          rsync -az --delete -e "$SSH" wasm-dist/ "$TARGET:/srv/web/releases/$RELEASE/"
          $SSH "$TARGET" "
            set -e
            ln -sfn /srv/web/releases/$RELEASE /srv/web/current
            cd /srv/web/releases && ls -1t | tail -n +4 | xargs -r rm -rf
          "
